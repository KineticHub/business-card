}

          }

          s = c;
        }
      }

      bitOut.write(table.indexOf(s), bitLength);

      // end code
      bitOut.write(endCode, bitLength);

      bitOut.flush();

      return byteOut.toByteArray();
    };

    var lzwTable = function() {

      var _map = {};
      var _size = 0;

      var _this = {};

      _this.add = function(key) {
        if (_this.contains(key) ) {
          throw 'dup key:' + key;
        }
        _map[key] = _size;
        _size += 1;
      };

      _this.size = function() {
        return _size;
      };

      _this.indexOf = function(key) {
        return _map[key];
      };

      _this.contains = function(key) {
        return typeof _map[key] != 'undefined';
      };

      return _this;
    };

    return _this;
  };

  var createDataURL = function(width, height, getPixel) {
    var gif = gifImage(width, height);
    for (var y = 0; y < height; y += 1) {
      for (var x = 0; x < width; x += 1) {
        gif.setPixel(x, y, getPixel(x, y) );
      }
    }

    var b = byteArrayOutputStream();
    gif.write(b);

    var base64 = base64EncodeOutputStream();
    var bytes = b.toByteArray();
    for (var i = 0; i < bytes.length; i += 1) {
      base64.writeByte(bytes[i]);
    }
    base64.flush();

    return 'data:image/gif;base64,' + base64;
  };

  //---------------------------------------------------------------------
  // returns qrcode function.

  return qrcode;
}();

// multibyte support
!function() {

  qrcode.stringToBytesFuncs['UTF-8'] = function(s) {
    // http://stackoverflow.com/questions/18729405/how-to-convert-utf8-string-to-byte-array
    function toUTF8Array(str) {
      var utf8 = [];
      for (var i=0; i < str.length; i++) {
        var charcode = str.charCodeAt(i);
        if (charcode < 0x80) utf8.push(charcode);
        else if (charcode < 0x800) {
          utf8.push(0xc0 | (charcode >> 6),
              0x80 | (charcode & 0x3f));
        }
        else if (charcode < 0xd800 || charcode >= 0xe000) {
          utf8.push(0xe0 | (charcode >> 12),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
        // surrogate pair
        else {
          i++;
          // UTF-16 encodes 0x10000-0x10FFFF by
          // subtracting 0x10000 and splitting the
          // 20 bits of 0x0-0xFFFFF into two halves
          charcode = 0x10000 + (((charcode & 0x3ff)<<10)
            | (str.charCodeAt(i) & 0x3ff));
          utf8.push(0xf0 | (charcode >>18),
              0x80 | ((charcode>>12) & 0x3f),
              0x80 | ((charcode>>6) & 0x3f),
              0x80 | (charcode & 0x3f));
        }
      }
      return utf8;
    }
    return toUTF8Array(s);
  };

}();

const profileInk = {
  whatsapp: "#167043",
  line: "#087640",
  linkedin: "#0a66c2",
  github: "#17211d",
};

function drawProfileQR(canvas, url, service) {
  const symbol = profileSymbols[service];
  const modules = qrcode(0, "H");
  modules.addData(url, "Byte");
  modules.make();
  const count = modules.getModuleCount();
  const quiet = 4;
  const cell = 8;
  const side = (count + quiet * 2) * cell;
  canvas.width = side;
  canvas.height = side;
  const context = canvas.getContext("2d", { alpha: false });
  if (!context) return;

  context.fillStyle = "#fff";
  context.fillRect(0, 0, side, side);
  context.fillStyle = "#111b17";
  for (let row = 0; row < count; row++) {
    for (let column = 0; column < count; column++) {
      if (modules.isDark(row, column)) {
        context.fillRect((column + quiet) * cell, (row + quiet) * cell, cell, cell);
      }
    }
  }

  // Center the logo on whole modules and preserve the four-module quiet zone.
  const badgeModules = Math.min(9, Math.floor(count * .215) | 1);
  const badge = badgeModules * cell;
  const offset = (side - badge) / 2;
  context.fillStyle = "#fff";
  context.fillRect(offset, offset, badge, badge);
  const scale = badge * .77 / Math.max(symbol.width, symbol.height);
  context.setTransform(scale, 0, 0, scale, (side - symbol.width * scale) / 2, (side - symbol.height * scale) / 2);
  context.fillStyle = profileInk[service];
  context.fill(new Path2D(symbol.path));
}

for (const port of card.querySelectorAll(".profile-port")) {
  const canvas = port.querySelector("canvas");
  const service = port.dataset.profile;
  const url = port.dataset.profileUrl.trim();
  if (url) {
    port.href = url;
    port.removeAttribute("aria-disabled");
    drawProfileQR(canvas, url, service);
    continue;
  }

  const { width, height, path, color } = profileSymbols[service];
  const context = canvas.getContext("2d");
  if (context) {
    const scale = 36 / Math.max(width, height);
    context.setTransform(scale, 0, 0, scale, (48 - width * scale) / 2, (48 - height * scale) / 2);
    context.fillStyle = color;
    context.fill(new Path2D(path));
  }
}

card.querySelector("[data-save]").addEventListener("click", () => {
  card.querySelector(".edition-message").textContent = "Open k-alnajar.vcf in Contacts to add this contact.";
});

const stage = card.querySelector(".stage-art");
const canvas = stage.querySelector("canvas");
const context = canvas.getContext("2d", { alpha: false });
if (!context) return;

const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
const loopDuration = 6200;
let visible = false;
let playing = false;
let fraction = 1;
let started = 0;
let frameId = 0;
let traces = [];

function paint() {
  if (traces.length === 0) return;
  const width = canvas.width / canvas.height * height;
  const scale = canvas.height / height;
  context.setTransform(scale, 0, 0, scale, 0, 0);
  circuit(context, width, fraction, traces);
}

function tick(now) {
  fraction = ((now - started) / loopDuration) % 1;
  paint();
  frameId = requestAnimationFrame(tick);
}

function syncAnimation() {
  const shouldPlay = visible && !document.hidden && !reducedMotion.matches;
  if (playing === shouldPlay) return;
  playing = shouldPlay;
  card.classList.toggle("is-running", playing);
  if (playing) {
    started = performance.now();
    frameId = requestAnimationFrame(tick);
  } else {
    cancelAnimationFrame(frameId);
    fraction = 1;
    paint();
  }
}

const resizeObserver = new ResizeObserver(([{ contentRect }]) => {
  if (!contentRect.width || !contentRect.height) return;
  const density = Math.min(devicePixelRatio || 1, 1.75);
  canvas.width = Math.max(1, Math.round(contentRect.width * density));
  canvas.height = Math.max(1, Math.round(contentRect.height * density));
  traces = routeCircuitBoard(stage);
  paint();
});
resizeObserver.observe(stage);

const viewObserver = new IntersectionObserver(([entry]) => {
  visible = entry.isIntersecting;
  syncAnimation();
});
viewObserver.observe(stage);
reducedMotion.addEventListener("change", syncAnimation);
document.addEventListener("visibilitychange", syncAnimation);
})();
</script>
